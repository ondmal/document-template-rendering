<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">System context</title>
  <desc id="desc">Consuming services send a template name and data through the internal API gateway, which authenticates them against the identity provider and forwards the call to the template rendering service. The service reads templates from shared template storage, where template maintainers publish them, streams the PDF back, and sends telemetry to Honeycomb. Consumers pass the PDFs that need signatures to the signing service; the two services never call each other.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#e6eaf1"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ours" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#eaefff"/>
    </linearGradient>
    <linearGradient id="oursStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcfe"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="aAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d84ff"/>
    </marker>
    <marker id="aMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a7b2c6"/>
    </marker>
    <filter id="shadow" x="-10%" y="-25%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2.2px; fill: #4f6bff; }
      .h1      { font-size: 21px; font-weight: 600; fill: #0f172a; }
      .ttl     { font-size: 14px; font-weight: 600; fill: #111827; }
      .ttlL    { font-size: 16px; font-weight: 600; fill: #0b1020; }
      .sub     { font-size: 11.5px; fill: #64748b; }
      .subO    { font-size: 11.5px; fill: #4a58b8; }
      .pill    { font-size: 11px; fill: #475569; }
      .chip    { font-size: 11px; font-weight: 500; fill: #3546b3; }
      .legend  { font-size: 11.5px; fill: #64748b; }
      .cardO   { fill: url(#ours); stroke: url(#oursStroke); stroke-width: 1.5; filter: url(#shadow); }
      .cardE   { fill: url(#ext); stroke: #dde3ee; stroke-width: 1.2; filter: url(#shadow); }
      .glowO   { fill: none; stroke: #6d8dff; stroke-width: 6; stroke-opacity: 0.22; }
      .tileO   { fill: #4f6bff; fill-opacity: 0.12; }
      .tileE   { fill: #0f172a; fill-opacity: 0.05; }
      .icO     { fill: none; stroke: #4f6bff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .icE     { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .lnO     { fill: none; stroke: #6d84ff; stroke-width: 1.8; }
      .lnE     { fill: none; stroke: #a7b2c6; stroke-width: 1.5; }
      .pillBg  { fill: #ffffff; stroke: #d6dce8; stroke-width: 1; }
      .chipBg  { fill: #4f6bff; fill-opacity: 0.08; stroke: #4f6bff; stroke-opacity: 0.35; stroke-width: 1; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="620" rx="22" fill="url(#bg)"/>
  <rect width="1100" height="620" rx="22" fill="url(#dots)"/>
  <ellipse cx="535" cy="360" rx="420" ry="240" fill="url(#halo)"/>

  <!-- Header -->
  <text class="eyebrow" x="44" y="48">SYSTEM CONTEXT</text>
  <text class="h1" x="44" y="76">Word templates in, signable PDF/A out</text>
  <circle cx="842" cy="56" r="5" fill="url(#oursStroke)"/>
  <text class="legend" x="854" y="60">built in this project</text>
  <circle cx="985" cy="56" r="5" fill="#c3ccdb"/>
  <text class="legend" x="997" y="60">external</text>

  <!-- ===== Connectors ===== -->
  <!-- consumers -> gateway -->
  <path class="lnE" d="M535 178 V228" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="463" y="192" width="144" height="22" rx="11"/>
  <text class="pill" x="535" y="207" text-anchor="middle">template + data → PDF</text>

  <!-- consumers -> signing service -->
  <path class="lnE" d="M700 142 H836" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="726" y="131" width="84" height="22" rx="11"/>
  <text class="pill" x="768" y="146" text-anchor="middle">PDFs to sign</text>

  <!-- IdP <-> gateway -->
  <path class="lnE" d="M254 268 H381" marker-start="url(#aMuted)" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="287" y="257" width="60" height="22" rx="11"/>
  <text class="pill" x="317" y="272" text-anchor="middle">OAuth</text>

  <!-- gateway -> service -->
  <path class="lnO" d="M535 304 V352" marker-end="url(#aAccent)"/>
  <rect class="pillBg" x="474" y="317" width="122" height="22" rx="11"/>
  <text class="pill" x="535" y="332" text-anchor="middle">authenticated calls</text>

  <!-- storage -> service -->
  <path class="lnE" d="M836 414 H724" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="728" y="403" width="104" height="22" rx="11"/>
  <text class="pill" x="780" y="418" text-anchor="middle">loads templates</text>

  <!-- maintainers -> storage -->
  <path class="lnE" d="M950 516 V460" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="918" y="477" width="64" height="22" rx="11"/>
  <text class="pill" x="950" y="492" text-anchor="middle">publish</text>

  <!-- service -> observability -->
  <path class="lnE" d="M420 472 V512 H254" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="272" y="501" width="132" height="22" rx="11"/>
  <text class="pill" x="338" y="516" text-anchor="middle">traces · metrics · logs</text>

  <!-- ===== External: consuming services (stacked) ===== -->
  <rect class="cardE" x="385" y="102" width="300" height="64" rx="12" transform="translate(10 -8)" opacity="0.7"/>
  <rect class="cardE" x="385" y="110" width="300" height="64" rx="12"/>
  <rect class="tileE" x="399" y="126" width="32" height="32" rx="8"/>
  <g transform="translate(407 134)">
    <rect class="icE" x="1" y="5" width="10" height="10" rx="1.5"/>
    <path class="icE" d="M5 5 V1 H15 V11 H11"/>
  </g>
  <text class="ttl" x="443" y="137">Consuming services</text>
  <text class="sub" x="443" y="156">business flows that need documents</text>

  <!-- ===== External: signing service ===== -->
  <rect class="cardE" x="840" y="110" width="220" height="64" rx="12"/>
  <rect class="tileE" x="854" y="126" width="32" height="32" rx="8"/>
  <g transform="translate(862 134)">
    <path class="icE" d="M2 14 L3 10.5 L11 2.5 L13.5 5 L5.5 13 Z"/>
    <path class="icE" d="M9.5 4 L12 6.5"/>
  </g>
  <text class="ttl" x="898" y="137">Signing service</text>
  <text class="sub" x="898" y="156">signs the generated PDFs</text>

  <!-- ===== External: gateway ===== -->
  <rect class="cardE" x="385" y="236" width="300" height="64" rx="12"/>
  <rect class="tileE" x="399" y="252" width="32" height="32" rx="8"/>
  <g transform="translate(407 260)">
    <path class="icE" d="M8 1 L14 3.5 V8 C14 11.5 11 14 8 15 C5 14 2 11.5 2 8 V3.5 Z"/>
    <path class="icE" d="M5.5 8 L7.3 9.8 L10.8 6.3"/>
  </g>
  <text class="ttl" x="443" y="263">Internal API gateway</text>
  <text class="sub" x="443" y="282">authenticates every calling service</text>

  <!-- ===== External: identity provider ===== -->
  <rect class="cardE" x="40" y="236" width="210" height="64" rx="12"/>
  <rect class="tileE" x="54" y="252" width="32" height="32" rx="8"/>
  <g transform="translate(62 260)">
    <circle class="icE" cx="5.5" cy="8" r="3.5"/>
    <path class="icE" d="M9 8 H15 M13 8 V11 M15 8 V10.5"/>
  </g>
  <text class="ttl" x="98" y="263">Identity provider</text>
  <text class="sub" x="98" y="282">service tokens</text>

  <!-- ===== Built in this project: the service ===== -->
  <rect class="glowO" x="350" y="358" width="370" height="110" rx="14" filter="url(#glow)"/>
  <rect class="cardO" x="350" y="358" width="370" height="110" rx="14"/>
  <rect class="tileO" x="366" y="374" width="34" height="34" rx="9"/>
  <g transform="translate(375 383)">
    <path class="icO" d="M3 1 H10 L13 4 V15 H3 Z M10 1 V4 H13"/>
    <path class="icO" d="M5.5 8 H10.5 M5.5 11 H10.5"/>
  </g>
  <text class="ttlL" x="412" y="388">Template rendering service</text>
  <text class="subO" x="412" y="406">fills Word templates · PDF/A-2u · stateless</text>
  <rect class="chipBg" x="366" y="428" width="104" height="22" rx="11"/>
  <text class="chip" x="418" y="443" text-anchor="middle">Resolve &amp; cache</text>
  <rect class="chipBg" x="478" y="428" width="100" height="22" rx="11"/>
  <text class="chip" x="528" y="443" text-anchor="middle">Feature engine</text>
  <rect class="chipBg" x="586" y="428" width="118" height="22" rx="11"/>
  <text class="chip" x="645" y="443" text-anchor="middle">Signature fields</text>

  <!-- ===== External: template storage ===== -->
  <rect class="cardE" x="840" y="372" width="220" height="84" rx="12"/>
  <rect class="tileE" x="854" y="388" width="32" height="32" rx="8"/>
  <g transform="translate(862 396)">
    <path class="icE" d="M1 4 V13 H15 V5.5 H8 L6.5 3 H1 Z"/>
  </g>
  <text class="ttl" x="898" y="399">Template storage</text>
  <text class="sub" x="898" y="418">shared · templates · config</text>
  <text class="sub" x="898" y="436">versions per template</text>

  <!-- ===== External: template maintainers ===== -->
  <rect class="cardE" x="840" y="520" width="220" height="64" rx="12"/>
  <rect class="tileE" x="854" y="536" width="32" height="32" rx="8"/>
  <g transform="translate(862 544)">
    <circle class="icE" cx="8" cy="5" r="3"/>
    <path class="icE" d="M2 15 C2 11 4.7 9.5 8 9.5 C11.3 9.5 14 11 14 15"/>
  </g>
  <text class="ttl" x="898" y="547">Template maintainers</text>
  <text class="sub" x="898" y="566">author and version templates</text>

  <!-- ===== External: observability ===== -->
  <rect class="cardE" x="40" y="480" width="210" height="64" rx="12"/>
  <rect class="tileE" x="54" y="496" width="32" height="32" rx="8"/>
  <g transform="translate(62 504)">
    <path class="icE" d="M1 8 H4 L6 3 L9 13 L11 8 H15"/>
  </g>
  <text class="ttl" x="98" y="507">Honeycomb</text>
  <text class="sub" x="98" y="526">traces · dashboard · alerts</text>
</svg>
